<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12261c">
  <title>DrainSmart Crew</title>
  <style>
    :root {
      --bg: #f3f5f2; --card: #ffffff; --ink: #17231c; --ink2: #4b5a51; --muted: #7a877f; --line: #e1e6e1;
      --brand: #1f7a55; --brand-ink: #0f5137; --dark: #12261c;
      --crit: #c42f2f; --high: #d4661a; --fault: #6f7680; --ok: #2f9e66; --water: #2f6fb5;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Telugu", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-size: 16px; padding-bottom: env(safe-area-inset-bottom, 0px); }
    header { background: var(--dark); color: #f4f3ec; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; position: sticky; top: 0; z-index: 5; }
    .hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { font-weight: 750; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .conn { font-size: 12px; display: flex; align-items: center; gap: 6px; color: #bfd8cb; }
    .conn i { width: 9px; height: 9px; border-radius: 50%; background: #8a8f99; display: inline-block; }
    .conn.on i { background: #4fd08f; } .conn.err i { background: #f06a6a; }
    .controls { display: flex; gap: 8px; margin-top: 10px; }
    .controls select { flex: 1; min-width: 0; border: 0; border-radius: 9px; padding: 9px 10px; font: inherit; font-size: 14px; background: #1f3a2c; color: #f4f3ec; }
    main { padding: 14px 16px 40px; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
    .empty { color: var(--muted); font-size: 14px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; }
    .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(20,40,30,.06); }
    .task .band { height: 6px; background: var(--ink2); }
    .task.crit .band { background: var(--crit); } .task.high .band { background: var(--high); } .task.fault .band { background: var(--fault); } .task.done .band { background: var(--ok); }
    .tbody { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .t1 { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
    .t1 b { font-size: 18px; line-height: 1.25; }
    .sev { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: #fff; white-space: nowrap; }
    .sev.crit { background: var(--crit); } .sev.high { background: var(--high); } .sev.fault { background: var(--fault); } .sev.done { background: var(--ok); }
    .sub { color: var(--ink2); font-size: 14px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .facts div { background: #f5f7f5; border-radius: 9px; padding: 8px 10px; }
    .facts span { display: block; font-size: 12px; color: var(--muted); }
    .facts strong { font-size: 17px; font-variant-numeric: tabular-nums; }
    .mini svg { width: 100%; height: auto; display: block; }
    .acts { display: flex; flex-direction: column; gap: 8px; }
    .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 11px; padding: 13px 14px; font: inherit; font-weight: 650; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; display: block; width: 100%; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
    .btn:disabled { opacity: .5; }
    .btn:focus-visible { outline: 3px solid #8fd3ae; outline-offset: 2px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .photo-in { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink2); }
    .photo-in label { flex: 1; }
    .photo-in img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .warn { color: var(--crit); font-weight: 600; font-size: 14px; }
    .status { font-size: 14px; color: var(--ink2); background: #f1f8f4; border-radius: 9px; padding: 9px 11px; }
    .progress { height: 8px; background: #e7ece7; border-radius: 5px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: var(--brand); }
    .modal { position: fixed; inset: 0; background: rgba(10,20,15,.5); display: flex; align-items: flex-end; z-index: 20; }
    .modal[hidden] { display: none; }
    .sheet { background: #fff; width: 100%; border-radius: 18px 18px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); max-width: 560px; margin: 0 auto; }
    .sheet h3 { margin: 0 0 10px; font-size: 18px; }
    .chk { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .chk input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); background: var(--dark); color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 30; text-align: center; }
    .toast[hidden] { display: none; }
    .foot { font-size: 12px; color: var(--muted); text-align: center; }
    .joinbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .joinbox input { font: inherit; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#1f7a55"/><path d="M7 19c3-3 6 3 9 0s6 3 9 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M16 6v7m-3-3 3 3 3-3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="tTitle">DrainSmart Crew</span>
      </div>
      <div class="conn" id="conn"><i></i><span id="connText">…</span></div>
    </div>
    <div class="controls">
      <select id="crewSel" aria-label="Your crew">
        <option value="A">Crew A · Ravi & Suresh</option>
        <option value="B">Crew B · Lakshmi & Imran</option>
        <option value="C">Panchayat contractor (JCB)</option>
      </select>
      <select id="langSel" aria-label="Language" style="flex:0 0 auto;width:auto">
        <option value="te">తెలుగు</option>
        <option value="hi">हिन्दी</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <main id="main"></main>

  <div class="modal" id="safety" hidden>
    <div class="sheet">
      <h3 id="sTitle"></h3>
      <div id="sList"></div>
      <div class="row2" style="margin-top:14px">
        <button class="btn" id="sCancel"></button>
        <button class="btn primary" id="sGo" disabled></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="sync.js"></script>
  <script src="crew.js"></script>
</body>
</html>
